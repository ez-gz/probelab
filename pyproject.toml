[project]
name = "probelab"
version = "0.0.1"
description = "Cheap activation monitors: extract once, train many probes, eval at deployment operating points."
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "safetensors>=0.4",
  "typer>=0.12",
  "rich>=13",
  "datasets>=2.20",
]

[project.scripts]
probelab = "probelab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probelab"]
